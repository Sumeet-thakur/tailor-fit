# /etc/mongod.conf
# This file is version-controlled in the repository.
# To deploy this config to the VPS, run: sudo ./scripts/setup-mongo-cache.sh

# Where and how to store data.
storage:
  dbPath: /var/lib/mongodb
  journal:
    enabled: true
  #  engine:
  #  wiredTiger:
  wiredTiger:
    engineConfig:
      # CAP THE CACHE TO PREVENT RAM EXHAUSTION ON A 4GB VPS
      # Adjust this value proportionally if upgrading server RAM
      # (e.g., set to 2.0 for an 8GB server)
      cacheSizeGB: 0.5 

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# network interfaces
net:
  port: 27017
  bindIp: 127.0.0.1


# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

#security:
#  authorization: enabled

#operationProfiling:

#replication:

#sharding:

## Enterprise-Only Options:

#auditLog:

#snmp:
